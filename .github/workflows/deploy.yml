# Сборка, проверка контента и публикация сайта на GitHub Pages.
# Один раз нужно включить Pages: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Build & deploy

on:
  push:
    branches: [main, claude/hopeful-fermat-s2s1vs]
  pull_request:
  workflow_dispatch:

# Минимум прав: сборка (где выполняется код npm-пакетов) только читает репозиторий,
# права на публикацию есть лишь у шага deploy.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # действия закреплены на коммитах: тег можно переписать, коммит — нет
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка контента и тесты
        run: npm test
      - name: Проверка типов
        run: npm run check
      - name: Сборка
        run: npm run build
      - name: SPA-фолбэк
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
