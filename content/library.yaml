  # ── Грамматика и справочники ───────────────────────────
  - id: alatyrev1983
    title: Краткий грамматический очерк удмуртского языка
    author: В. И. Алатырев
    year: '1983'
    kind: grammar
    level: все
    lang: ru
    rights: free
    url: http://www.udmurt.info/library/alatyrev/grammatika
    note: 'Компактная грамматика: падежи, спряжение, отрицание. Главная опора при проверке наших уроков. Есть у группы.'
    group: true
  - id: karakulova2001
    title: Сопоставительная грамматика русского и удмуртского языков
    author: М. К. Каракулова, Б. И. Каракулов
    year: 2001, Ижевск
    kind: grammar
    level: A2+
    lang: ru
    rights: print
    note: 'Глазовские авторы сравнивают русский и удмуртский — ровно то, что нужно русскоязычным. Есть у группы.'
    group: true
  - id: tuala-udmurt-kyl
    title: '«Туала удмурт кыл» (фонетика, морфология, синтаксис)'
    author: А. Ф. Шутов, И. В. Тараканов, А. А. Алашеева
    year: '2003'
    kind: grammar
    level: A2+
    lang: udm
    rights: print
  - id: winkler2001
    title: Udmurt (Languages of the World/Materials 212)
    author: E. Winkler
    year: '2001'
    kind: grammar
    level: A2+
    lang: en
    rights: print
    url: https://uralic.clld.org/sources/winkler_udmurt_2001
  - id: winkler2011
    title: Udmurtische Grammatik
    author: E. Winkler
    year: '2011'
    kind: grammar
    level: A2+
    lang: de
    rights: print
  - id: winkler-wotjakisch
    title: Wotjakisch (обзор языка)
    author: E. Winkler
    year: '2002'
    kind: grammar
    level: все
    lang: de
    rights: free
    url: https://eeo.aau.at/wwwg.uni-klu.ac.at/eeo/Wotjakisch.pdf
  - id: dushenkova2020
    title: Эмоциосфера удмуртской языковой картины мира
    author: Т. Р. Душенкова
    year: 2020, УдмФИЦ УрО РАН
    kind: grammar
    level: B1+
    lang: ru
    rights: print
    note: 'Монография о словах эмоций: как по-удмуртски радуются, грустят, любят. Пригодится для будущих уроков. Есть у группы.'
    group: true

