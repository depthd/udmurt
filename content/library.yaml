# Каталог материалов по удмуртскому языку (страница «Материалы»).
# Источник: docs/research/06-udmurt-learning-materials.md §19, отчёты 02 и 05, книги от группы.
# rights:
#   open  — общественное достояние или открытая лицензия (можно переносить с указанием авторов)
#   free  — © но бесплатно онлайн (только ссылка)
#   print — © печатное или платное издание (только описание)
# unreachable: true — ссылка не открылась из нашей сети при проверке (может работать из России).
# Тексты со «: » внутри — в кавычках '…'.
items:
  # ── Начать с нуля ──────────────────────────────────────
  - id: kuara-video-ru
    title: Видеокурс удмуртского языка (10 уроков)
    author: НКО «Куара», ведущий А. Малинин
    year: '≤2022'
    kind: video
    level: A0–A1
    lang: ru
    rights: free
    url: https://www.youtube.com/playlist?list=PLrHDtZVU4rPQZUG8LtdYe7bQEQixWmTe5
    urls: [https://udmkyl.ru/video-courses/1]
    note: 'Лучший старт для взрослых: короткие уроки, к каждому — словарик. Урок 1 — знакомство, как у нас в юните 1.'
    top: true
    checked: '2026-10-22'
  - id: udmkyl
    title: Портал «Удмурт кылдунне» — всё для самостоятельного изучения
    author: НИИ национального образования УР
    year: 2022–
    kind: course
    level: A0–B1
    lang: ru
    rights: free
    url: https://udmkyl.ru/
    note: 'Главный хаб: приложения, видеокурсы, самоучители в PDF, 74 словаря, песни, мультфильмы, подкасты.'
    top: true
    checked: '2026-10-22'
  - id: napolskikh-lectures
    title: 'Удмуртский язык: ознакомительный курс (20 лекций)'
    author: В. В. Напольских
    year: 2000-е
    kind: grammar
    level: A0–A2
    lang: ru
    rights: free
    url: http://udmurt.info/udmurt/lekcii/
    note: Понятная грамматика по-русски, с примерами и упражнениями. По ней сверены модели наших фраз.
    top: true
  - id: uki050
    title: '«Ӟеч-а, бур-а, удмурт кыл!» — электронный учебник, 5 класс'
    author: Н. П. Боталова и др.
    year: '2021'
    kind: textbook
    level: A1
    lang: ru
    rights: free
    url: https://uki050.udmkyl.ru/
    note: Школьный курс для тех, кто не владеет удмуртским. Есть учебники для 1–11 классов.
    top: true
  - id: samarova2011
    title: '«Лабыр-лабыр лабыртом! Поговорим от души»'
    author: М. А. Самарова, О. Б. Стрелкова
    year: '2011'
    kind: textbook
    level: A0–B1
    lang: ru
    rights: free
    url: http://elibrary.udsu.ru/xmlui/bitstream/handle/123456789/8178/2011340.pdf?sequence=1
    note: '18 уроков для студентов (PDF, 244 с.). Урок 1 «Ойдолэ тодматском!» — знакомство.'
    top: true
  - id: timerkhanova2012
    title: '«Удмурт кыл: Нырысь кутскисьёслы» — тетрадь-книга №1'
    author: Н. Н. Тимерханова
    year: '2012'
    kind: textbook
    level: A0–A1
    lang: ru
    rights: free
    url: http://elibrary.udsu.ru/xmlui/bitstream/handle/123456789/7811/2011335.pdf?sequence=1
    note: Диалоги и словник для начинающих (PDF, 155 с.). Отсюда модели «Мон студент», «Улӥсько Глазкарын».
    top: true
  - id: tg-udmurtkyl
    title: Telegram «Удмурт кыл | Удмуртский язык»
    author: О. Урасинова
    kind: community
    level: A1–B1
    lang: udm
    rights: free
    url: https://t.me/udmurtkyl
    note: Короткие посты на каждый день — удобно читать по дороге на пару.
    top: true
    checked: '2026-10-22'
  - id: courses-glazov
    title: Бесплатные курсы удмуртского для взрослых (в том числе в Глазове, ГИПУ)
    author: Миннац УР, «Выжы»
    kind: course
    level: A0–
    lang: ru
    rights: free
    url: https://vk.com/udmkyl
    note: 'Живой преподаватель и разговорная практика. Набор — ежегодно, уточняйте даты.'
    top: true
    unreachable: true

