id: u9-chukaze
title: Завтра
title_udm: Мар карыны малпаськод?
description: 'Будущее время и «могу / умею»'
guide: |
  ## Будущее время
  Окончание будущего — **-о** (у глаголов на -аны — **-ло**):

  | | мыныны «идти» | ужаны «работать» |
  |---|---|---|
  | мон (я) | мын**о** — пойду | ужа**ло** — буду работать |
  | тон (ты) | мын**од** — пойдёшь | ужа**лод** |
  | со (он, она) | мын**оз** — пойдёт | ужа**лоз** |

  Три времени одного глагола: **мынӥсько** «иду» · **мынӥ** «пошёл» · **мыно** «пойду».

  - **Мон солы жингырто.** — «Я ей позвоню».
  - **Мар юод?** — «Что будешь пить?»
  - **Со ӝоген лыктоз.** — «Он скоро придёт».

  ## Могу, умею — быгатыны
  Глагол на **-ны** + **быгатыны**:
  - **Мон сое тупатыны быгатӥсько.** — «Я могу это исправить».
  - **Тон уяны быгатӥськод.** — «Ты умеешь плавать».
  - **Жаляса верано, уг быгатӥськы.** — «К сожалению, не могу».
