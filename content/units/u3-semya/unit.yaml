id: u3-semya
title: Семья
title_udm: Мынам бадӟым семьяе
description: 'Мама и папа, братья и сёстры; «у меня есть» и «у меня нет»'
guide: |
  ## Родные
  - **анай** мама, **атай** папа, **анай-атай** родители («мама-папа»)
  - **песянай** бабушка, **песятай** дедушка
  - **агай** старший брат (и дядя), **вын** младший брат
  - **апай** старшая сестра (и тётя), **сузэр** младшая сестра
  - **пи** сын, **ныл** дочь, **нылпи** ребёнок («дочь-сын»)

  ## «Мой» — суффикс
  Обычно «мой» — **-э / -е**: **эш → эше** «мой друг», **пи → пие** «мой сын», **семья → семьяе** «моя семья», **агай → агае** «мой брат».
  - У небольшой группы слов (части тела, некоторые родственники, **ним** «имя», **дыр** «время») — **-ы**: **ныл → нылы** «моя дочь», **вын → выны** «мой младший брат», **ним → нимы**.
  - «твой» — **-эд / -ед** (**атай → атаед**), у тех же слов — **-ыд**: **тынад выныд** «твой брат».

  ## У меня есть / у меня нет
  - **Мынам нылы вань.** — «У меня есть дочь» (букв. «моя дочь-моя есть»).
  - **Мынам дыры ӧвӧл.** — «У меня нет времени».
  - **Тӥляд нылпиосты вань-а?** — «Есть ли у вас дети?»

  ## Связки нет
  **Мынам пие студент.** — «Мой сын — студент». На письме иногда ставят тире: **Та кышномурт — эмчи.**
