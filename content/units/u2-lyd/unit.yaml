id: u2-lyd
title: Числа
title_udm: Одӥг, кык, куинь!
description: 'Считаем до тысячи, называем возраст и время'
guide: |
  ## 1–10
  **одӥг** 1 · **кык** 2 · **куинь** 3 · **ньыль** 4 · **вить** 5 · **куать** 6 · **сизьым** 7 · **тямыс** 8 · **укмыс** 9 · **дас** 10

  ## 11–19 — «десять + число»
  - **дас одӥг** 11, **дас куинь** 13, **дас сизьым** 17, **дас укмыс** 19

  ## Десятки
  - **кызь** 20, **куамын** 30
  - с 40 до 90 — «число + тон/дон» (*тон* когда-то значило «десять»): **ньыльдон** 40, **витьтон** 50, **куатьтон** 60, **сизьымдон** 70, **тямыстон** 80, **укмыстон** 90
  - **сю** 100, **сюрс** 1000
  - составные — просто подряд: **кызь ньыль** 24, **куатьтон кык** 62

  ## После числа — единственное число
  **сизьым нунал** «семь дней» (букв. «семь день»), **кык корка** «два дома».

  ## Возраст и время
  - **Мыным кызь арес.** — «Мне 20 лет». **Солы дас сизьым арес.** — «Ей 17 лет».
  - **Али куинь час.** — «Сейчас три часа».
  - **Кык часын лыкты.** — «Приходи в два часа»: «во сколько?» — окончание **-ын**.
