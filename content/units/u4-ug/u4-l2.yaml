      - { who: Даша, item: mar-kariskod }
      - { who: '{name}', item: siskisko }
      - { who: '{name}', item: nosh-ton-mar-kariskod }
      - { who: Даша, item: mon-lydzisko }
    question: Что делает Даша?
    options: [Читает, Ест, Работает]
