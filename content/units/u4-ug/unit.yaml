id: u4-ug
title: Что ты делаешь?
title_udm: Мар кариськод?
description: 'Глаголы в настоящем времени, «куда?», «люблю» и «не»'
guide: |
  ## Настоящее время — три лица
  У глаголов на **-ыны** (лыдӟыны «читать»): **мон лыдӟ-исько** · **тон лыдӟ-иськод** · **со лыдӟ-е**
  У глаголов на **-аны** (ужаны «работать»): **мон ужа-сько** · **тон ужа-ськод** · **со ужа**
  - После **д, з, л, н, с, т** пишется **ӥ**: **мын-ӥсько**, **ветл-ӥсько**, **ярат-ӥсько**; «он, она» после них — **-э**: **мынэ**, **улэ**.
  - Местоимение можно опустить: **Сиськисько.** — «Ем».

  ## Где? Куда? Откуда?
  - **кытын** где → **-ын**: университетын «в университете»
  - **кытчы** куда → **-э / -е**: школае «в школу», музее «в музей»
  - **кытысь** откуда → **-ысь**: Глазкарысь «из Глазова»

  ## Люблю + -ны
  **Мон яратӥсько лыдӟиськыны.** — «Я люблю читать».

  ## «Не» — отрицательный глагол
  - **мон уг** + форма на **-ськы**: **Мон уг тодӥськы.** — «Я не знаю».
  - **тон уд**: **Тон монэ уд кылзӥськы.** — «Ты меня не слушаешь».
  - **со уг** + основа глагола без окончания: **Том Австралие уг мыны.** — «Том не едет в Австралию», **Нокин но уг тоды.** — «Никто не знает».
  - В **Том англи сямен уг вераськы** «-ськы» — часть самого глагола вераськыны, а не окончание «я».
