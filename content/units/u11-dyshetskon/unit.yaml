id: u11-dyshetskon
title: На паре
title_udm: Юанъёсты вань-а?
description: 'Понимаю / не понимаю, вопросы, книги, учёба'
guide: |
  ## Понимаю — не понимаю
  - **Валай.** — «Понял(а)». **Валамон.** — «Понятно».
  - **Валасько, лэся.** — «Кажется, понимаю».
  - **Мон тонэ ӧй вала.** — «Я тебя не понял(а)».
  - **Кызьы со? Мон ӧй вала.** — «Как это? Я не понял(а)».

  ## Вопросы
  - **Юанъёсты вань-а?** — «Есть вопросы?»
  - **Вождэс эн вае, мынам юанэ вань.** — «Извините, у меня есть вопрос».
  - **Мар та?** — «Что это?»

  ## Чьё?
  **Кинлэн книгаез?** — «Чья книга?» — **Та книга мынам.** — «Эта книга моя».

  ## Учёба
  - **Тон кинлы дышетскиськод?** — «На кого ты учишься?»
  - **Мон гуртэ уж лэсьтӥсько.** — «Я делаю домашнее задание».

  ## Можно?
  Глагол на **-ны** + **луоз-а?**: **Укноез усьтыны луоз-а?** — «Можно открыть окно?»
