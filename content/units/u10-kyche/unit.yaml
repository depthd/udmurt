id: u10-kyche
title: Какой?
title_udm: Кыӵе чебер!
description: 'Цвета, «какой?», пожелания, «у меня болит»'
guide: |
  ## Цвета
  **горд** красный · **тӧдьы** белый · **сьӧд** чёрный · **вож** зелёный · **лыз** синий · **ӵуж** жёлтый · **пурысь** серый · **чагыр** голубой

  Прилагательное стоит **перед** словом и не меняется: **вож машина**, **вож яблоко**, **горд дэрем**.
  Без «быть»: **Та бумага тӧдьы.** — «Эта бумага белая».

  ## Какой?
  **бадӟым** большой · **пичи** маленький · **выль** новый · **чебер** красивый · **ӟеч** хороший · **урод** плохой

  - **Кыӵе чебер вуюись!** — «Какая красивая радуга!»
  - **Кудӥз корка выль?** — «Который дом новый?»

  ## Пожелания
  - **Выль ӵукнаен!** — «Доброе утро!» (букв. «с новым утром»)
  - **Ӟеч нуналэн.** — «Добрый день».
  - **Выль арен!** — «С Новым годом!»
  - **Сюресты ӟеч медло!** — «Счастливого пути!»

  ## У меня болит
  **Мынам йыры висе.** — «У меня болит голова» (йыр-**ы** «моя голова»).
  **Маид тынад висе?** — «Что у тебя болит?»
