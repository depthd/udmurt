id: u6-kar
title: Город
title_udm: Кытын лыдӟиськонни?
description: 'Места в городе, «где? куда? откуда?», транспорт, далеко и близко'
guide: |
  ## Места в городе
  **кар** город · **урам** улица · **вокзал** · **почта** · **лыдӟиськонни** библиотека · **сиськонни** столовая · **дугдылонни** остановка · **вузаськонни** рынок

  Суффикс **-онни** значит «место, где…»: сиськыны «есть» → **сиськонни** «столовая», лыдӟиськыны «читать» → **лыдӟиськонни** «библиотека». Это словообразование, а не окончание «я» (-исько).

  ## Где? Куда? Откуда?
  Вместо предлогов «в», «из» — окончания:

  | вопрос | окончание | пример |
  |---|---|---|
  | **кытын?** где? | -ын | **карын** — в городе, **кафеын** — в кафе |
  | **кытчы?** куда? | -э / -е | **аэропортэ** — в аэропорт, **школае** — в школу |
  | **кытысь?** откуда? | -ысь | **Глазкарысь** — из Глазова |

  - **Кытын почта?** — «Где почта?»
  - **Ми аэропортэ мынӥськом.** — «Мы едем в аэропорт».

  ## На чём? Рядом с чем?
  - **Мон автобусэн мынӥсько.** — «Я еду на автобусе» (-эн — «на чём, чем»).
  - **Мон вокзал вӧзын улӥсько.** — «Я живу рядом с вокзалом». **Вӧзын**, **дорын** — послелоги: стоят *после* слова.

  ## Далеко и близко
  **татын** здесь · **отын** там · **кыдёкын** далеко · **матын** близко
  - **Почта кыдёкын-а?** — «Почта далеко?»
