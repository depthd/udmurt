id: u8-tolon
title: Вчера
title_udm: Мар тӥ толон кариды?
description: 'Прошедшее время: «я сделал», «ты сделал?», «он сделал», «был / не был»'
guide: |
  ## Прошедшее время
  Окончание меняется по лицу. Рода нет: **лыдӟи** — и «прочитал», и «прочитала».

  | | глаголы на -ыны | глаголы на -аны |
  |---|---|---|
  | мон (я) | лыдӟ**и**, мын**ӥ** | ужа**й** |
  | тон (ты) | лыдӟ**ид**, ветл**ӥд** | ужа**д** |
  | со (он, она) | из**из**, лыкт**ӥз** | ужа**з** |
  | тӥ (вы) | кар**иды**, ветл**ӥды** | ужа**ды** |

  Буква **ӥ** пишется вместо **и** только после твёрдых **д, з, л, н, с, т**: мын**ӥ**, ветл**ӥ**, лыкт**ӥз**.
  После остальных согласных — **и**: лыдӟ**и**, сиськ**и**.

  ## Был, не был
  - **Кытын тон толон вал?** — «Где ты вчера был(а)?»
  - **Толон мон киноын вал.** — «Вчера я был(а) в кино».

  «Не» в прошедшем — **ӧй** (я), **ӧд** (ты), **ӧз** (он, она), а глагол после него — в короткой форме:
  - **Мон толон нокытчы но ӧй ветлы.** — «Я вчера никуда не ходил(а)».
  - **Толон ӧз зоры.** — «Вчера не было дождя».

  С **вал** «был» отрицание всегда **ӧй**, для любого лица:
  - **Мон толон школаын ӧй вал.** — «Я вчера не был(а) в школе».
  - **Со татын ӧй вал.** — «Его здесь не было».
