id: u1-znakomstvo
title: Знакомство
title_udm: Тодматском!
description: 'Здороваемся, называем себя, говорим, кто мы, откуда и сколько нам лет'
guide: |
  ## Здороваемся и прощаемся
  - **Ӟечбуресь!** — «Здравствуйте!» (вежливо, многим)
  - **Ӟечбур!** — «Здравствуй!» (другу)
  - **Ӟеч лу!** — «Пока!», **Ӟеч луэ!** — «До свидания!» (вежливо)
  - **Тау!** — «Спасибо!», **Бадӟым тау!** — «Большое спасибо!»

  ## «Я — …» без глагола
  Связки «есть» в настоящем времени нет, как в русском:
  - **Мон Алексей.** — «Я Алексей».
  - **Мон студент.** — «Я студент». Рода нет: студент и студентка — одно слово.
  - **Мон студент ӧвӧл.** — «Я не студент»: **ӧвӧл** в конце.
  - **Мон но студент.** — «Я тоже студент»: **но** «тоже» стоит после слова.

  ## Вопрос «да/нет» — частица -а
  - **Тон студент-а?** — «Ты студент?» — **Бен.** «Да.» / **Ӧвӧл.** «Нет.»

  ## Притяжательные суффиксы
  **ним** «имя» → **ним-ы** «моё имя», **ним-ды** «ваше имя».
  - **Мынам нимы Алексей.** — «Меня зовут Алексей» (букв. «моё имя-моё Алексей»).
  - **Нош тынад?** — «А твоё?»

  ## Откуда? — исходный падеж -ысь
  **Глазкар** (или **Глаз**) «Глазов», **Ижкар** «Ижевск». **Кар** — «город».
  - **Мон Глазкарысь.** — «Я из Глазова».
  - **Тон кытысь луиськод?** — «Ты откуда?»

  ## Где? — местный падеж -ын
  - **Мон Глазкарын улӥсько.** — «Я живу в Глазове».
  - **Мон университетын дышетскисько.** — «Я учусь в университете».

  ## Возраст — «кому сколько лет»
  - **Кӧня тыныд арес?** — «Сколько тебе лет?»
  - **Мыным кызь арес.** — «Мне двадцать лет». 19 — **дас укмыс** («десять девять»).

  ## Глагол в настоящем времени (я)
  Окончание **-исько / -ӥсько / -сько**: **ул-ӥсько** «живу», **дышетск-исько** «учусь».
