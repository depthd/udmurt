id: u1-znakomstvo
title: Знакомство
title_udm: Тодматскон
description: Здороваемся, называем себя, говорим, откуда мы
guide: |
  ## Приветствия
  - **Ӟечбуресь!** — «Здравствуйте!» (вежливо, многим)
  - **Ӟечбур!** — «Здравствуй!» (другу)
  - **Ӟеч лу!** — «Пока!»
  - **Тау!** — «Спасибо!»

  ## «Я — …»
  Глагола «быть» в настоящем времени нет, как в русском: **Мон Алексей.** — «Я Алексей».

  ## Притяжательный суффикс
  **ним** «имя» → **ним-ы** «моё имя». Суффикс приклеивается к слову.

  ## «Из …» — исходный падеж -ысь
  **Глаз** «Глазов» → **Глаз-ысь** «из Глазова».
lessons: [u1-l1, u1-l2]
