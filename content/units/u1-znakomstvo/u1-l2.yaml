id: u1-l2
title: Мон — {name}
goal: Назвать себя и спросить имя
icon: 🏷️
exercises:
  - type: teach
    item: mon
  - type: teach
    item: mon-name
  - type: choice
    dir: ru-udm
    item: mon
    distractors: [ton]
  - type: teach
    item: nimy
  - type: build
    item: nimy
    extra: [ыд, ысь]
  - type: teach
    item: mynam-nimy
  - type: tiles
    item: mynam-nimy
    extra: [тон, ысь]
