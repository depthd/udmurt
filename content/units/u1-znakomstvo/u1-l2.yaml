  - type: fill
    text: Мон Глаз___.
    ru: Я из Глазова.
    options: [ысь, ын, э]
    answer: ысь
    item: mon-glazys
    explain: -ысь — «из» (исходный падеж). -ын — «в» (местный), -э — «в, куда» (входный).
  - type: dialogue
    lines:
      - { who: Преподаватель, item: zechbures }
      - { who: '{name}', item: zechbures }
      - { who: Преподаватель, item: kyzy-tilad-nimdy }
      - { who: '{name}', item: mynam-nimy }
    question: Что спросил преподаватель?
    options: [Как вас зовут?, Откуда вы?, Как поживаете?]
    answer: Как вас зовут?
  - type: type
    dir: ru-udm
    item: mon-name
  - type: tiles
    dir: udm-ru
    item: mon-glazys
    extra: [в, Ижевска]
