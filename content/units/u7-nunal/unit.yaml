id: u7-nunal
title: Дни недели
title_udm: Туннэ кыӵе нунал?
description: 'Сегодня, завтра, вчера; дни недели; погода'
guide: |
  ## Сегодня, завтра, вчера
  **туннэ** сегодня · **ӵуказе** завтра · **толон** вчера · **ӵуказе бере** (или **ӵуказе улыса**, **усьсэ**) послезавтра

  **Туннэ кыӵе нунал?** — «Какой сегодня день?»

  ## Дни недели
  | | |
  |---|---|
  | понедельник | **вордӥськон** |
  | вторник | **пуксён** |
  | среда | **вирнунал** |
  | четверг | **покчиарня** — букв. «младшее воскресенье» |
  | пятница | **удмуртарня** — букв. «удмуртское воскресенье» |
  | суббота | **кӧснунал** |
  | воскресенье | **арнянунал** |

  **Арня** — «неделя», а ещё «воскресенье»: от этого значения и названия четверга и пятницы. **Нунал** — «день».

  ## Будет и было
  - **Ӵуказе кезьыт луоз.** — «Завтра будет холодно». **Луоз** — «будет».
  - **Толон кезьыт вал.** — «Вчера было холодно». **Вал** — «было».

  ## Погода
  **куазь** погода · **шундыё** солнечный · **пильмо** пасмурно · **урод** плохой · **пӧсь** жарко · **кезьыт** холодно

  ## Прощаемся
  **Ӵуказеозь!** — «До завтра!» (-озь — «до»).
