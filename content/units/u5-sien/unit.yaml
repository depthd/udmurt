id: u5-sien
title: Еда
title_udm: Кыӵе ческыт!
description: 'Еда и напитки, «хочу», «нужно», «нравится», в магазине'
guide: |
  ## Еда и напитки
  **нянь** хлеб · **ву** вода · **йӧл** молоко · **чай** · **кофе** · **улмо** яблоко · **сӥль** мясо · **картофка** · **сиён** еда

  ## Хочу
  **Мынам чай юэме потэ.** — «Я хочу чай» (букв. «моё питьё чая выходит»).

  ## Нужно, нравится — «кому?»
  - **Мыным улмо кулэ.** — «Мне нужно яблоко».
  - **Тыныд кельше-а?** — «Тебе нравится?» — **Мыным со туж кельше.**

  ## Люблю / не люблю
  - **Мон пӧсь кофе яратӥсько.** — «Я люблю горячий кофе».
  - **Мон кезьыт кофе уг яратӥськы.** — «Я не люблю холодный кофе».

  ## В магазине
  - **Кӧня та картофка сылэ?** — «Сколько стоит эта картошка?»
  - **Та магазинын нянь вузаське-а?** — «В этом магазине продаётся хлеб?»
  - **Вай мыным нянь.** — «Дай мне хлеб».
