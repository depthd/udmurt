# Юнит 1 «Знакомство» — словник.
# Каждая запись — с источником и статусом:
#   verified — проверено носителем/преподавателем; sourced — из источника, ждёт проверки носителем;
#   draft — черновик (в уроки нельзя, тест не пропустит).
# {name} подставляется именем ученика (по умолчанию «Алексей»).
# Если в тексте есть двоеточие с пробелом, # или фигурные скобки внутри [списка] — берите текст в кавычки '…'.
items:
  # ── Приветствия ──────────────────────────────────────────
  - id: zechbures
    udm: Ӟечбуресь!
    ru: Здравствуйте!
    kind: phrase
    emoji: 👋
    morphemes:
      - { form: ӟеч, meaning: 'хороший', kind: root }
      - { form: бур, meaning: 'добрый, благополучный', kind: root }
      - { form: есь, meaning: 'вежливая форма (многим)', kind: suffix }
    note: 'Вежливое приветствие: преподавателю, старшим, сразу нескольким людям.'
    status: sourced
    sources: [{ id: tatoeba, ref: '5842206' }]
  - id: zechbur
    udm: Ӟечбур!
    ru: Здравствуй!
    ru_alt: [Привет!]
    kind: phrase
    emoji: 🙂
    note: Приветствие на «ты» — другу, одногруппнику.
    status: sourced
    sources: [{ id: tatoeba, ref: '5842203' }, { id: tatoeba, ref: '11539124' }, { id: timerkhanova2012 }]
  - id: tau
    udm: Тау!
    ru: Спасибо!
    ru_alt: [Благодарю!]
    kind: phrase
    emoji: 🙏
    status: sourced
    sources: [{ id: tatoeba, ref: '5842240' }, { id: uniparser }]
  - id: badzym-tau
    udm: Бадӟым тау!
    ru: Большое спасибо!
    kind: phrase
    emoji: 💐
    morphemes:
      - { form: бадӟым, meaning: 'большой', kind: word }
      - { form: тау, meaning: 'спасибо', kind: word }
    status: sourced
    sources: [{ id: tatoeba, ref: '12300271' }, { id: tatoeba, ref: '12451210' }]
  - id: zech-lu
    udm: Ӟеч лу!
    ru: Пока!
    ru_alt: [До свидания!]
    kind: phrase
    emoji: 👋
    note: Прощание на «ты». Буквально — «будь хорошим».
    status: sourced
    sources: [{ id: tatoeba, ref: '12159539' }]
  - id: zech-lue
    udm: Ӟеч луэ!
    ru: До свидания!
    kind: phrase
    emoji: 🤝
    note: Вежливое прощание — на «вы» или многим.
    status: sourced
    sources: [{ id: kuara }, { id: vakhrushev1983 }, { id: karakulova2001 }]
  - id: tau-umoj
    udm: Тау, умой!
    ru: Спасибо, хорошо!
    ru_alt: ['Благодарю, хорошо!']
    kind: phrase
    status: sourced
    sources: [{ id: tatoeba, ref: '5842240' }]
  - id: tuzh-umoj
    udm: Туж умой!
    ru: Очень хорошо!
    ru_alt: [Отлично!]
    kind: phrase
    emoji: 👍
    morphemes:
      - { form: туж, meaning: 'очень', kind: word }
      - { form: умой, meaning: 'хорошо', kind: word }
    status: sourced
    sources: [{ id: tatoeba, ref: '11750171' }, { id: tatoeba, ref: '12259123' }]
  - id: kyzy-uliskody
    udm: Кызьы улӥськоды?
    ru: Как поживаете?
    ru_alt: [Как дела?, Как вы поживаете?]
    kind: phrase
    morphemes:
      - { form: кызьы, meaning: 'как', kind: word }
      - { form: ул, meaning: 'жить', kind: root }
      - { form: ӥськоды, meaning: '(вы) — наст. время', kind: suffix }
    status: sourced
    sources: [{ id: tatoeba, ref: '5842223' }]
  - id: ben
    udm: Бен.
    ru: Да.
    kind: word
    emoji: ✅
    status: sourced
    sources: [{ id: tatoeba, ref: '12139184' }, { id: napolskikh }]
  - id: ovol
    udm: Ӧвӧл.
    ru: Нет.
    kind: word
    emoji: ❌
    note: 'Ӧвӧл — «нет» и «не (есть)». Буква ӧ — звук между о и э.'
    status: sourced
    sources: [{ id: tatoeba, ref: '12139185' }, { id: alatyrev1983 }]

  # ── Я, ты, имя ───────────────────────────────────────────
  - id: mon
    udm: мон
    ru: я
    pos: местоимение
    emoji: 🙋
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: ton
    udm: тон
    ru: ты
    pos: местоимение
    emoji: 👉
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: nim
    udm: ним
    ru: имя
    pos: существительное
    emoji: 🏷️
    status: sourced
    sources: [{ id: uniparser }, { id: kyllyukam2012 }]
  - id: nimy
    udm: нимы
    ru: моё имя
    pos: существительное
    morphemes:
      - { form: ним, meaning: 'имя', kind: root }
      - { form: ы, meaning: 'мой (притяжательный суффикс 1 лица)', kind: suffix }
    note: 'Притяжательный суффикс прирастает к слову — как в финском nimi → nimeni.'
    status: sourced
    sources: [{ id: tatoeba, ref: '11525033' }, { id: alatyrev1983 }]
  - id: mon-name
    udm: Мон {name}.
    ru: Я {name}.
    kind: phrase
    note: Глагола-связки «есть» в настоящем времени нет — как в русском «Я Алексей».
    status: sourced
    sources: [{ id: tatoeba, ref: '11672703' }, { id: timerkhanova2012 }]
  - id: mynam-nimy
    udm: Мынам нимы {name}.
    ru: Меня зовут {name}.
    ru_alt: ['Моё имя {name}.', 'Моё имя — {name}.']
    kind: phrase
    morphemes:
      - { form: мынам, meaning: 'мой, у меня (форма от мон)', kind: word }
      - { form: ним, meaning: 'имя', kind: root }
      - { form: ы, meaning: 'моё', kind: suffix }
      - { form: '{name}', meaning: 'имя', kind: word }
    status: sourced
    sources: [{ id: tatoeba, ref: '11525033' }, { id: samarova2011 }, { id: kuara }]
  - id: nosh-tynad
    udm: Нош тынад?
    ru: А тебя? (А твоё имя?)
    ru_alt: [А тебя?, А твоё?, А твоё имя?]
    kind: phrase
    morphemes:
      - { form: нош, meaning: 'а', kind: word }
      - { form: тынад, meaning: 'твой, у тебя (форма от тон)', kind: word }
    note: 'Короткий встречный вопрос после «Мынам нимы …» — «а твоё?».'
    status: sourced
    sources: [{ id: tatoeba, ref: '12318610' }]
  - id: kyzy-tilad-nimdy
    udm: Кызьы тӥляд нимды?
    ru: Как вас зовут?
    ru_alt: [Как Вас зовут?, Вас как зовут?]
    kind: phrase
    morphemes:
      - { form: кызьы, meaning: 'как', kind: word }
      - { form: тӥляд, meaning: 'ваш, у вас', kind: word }
      - { form: ним, meaning: 'имя', kind: root }
      - { form: ды, meaning: 'ваше', kind: suffix }
    status: sourced
    sources: [{ id: tatoeba, ref: '11522722' }]
  - id: oydo-todmatskom
    udm: Ойдо тодматском!
    ru: Давай познакомимся!
    ru_alt: [Давай знакомиться!]
    kind: phrase
    emoji: 🤝
    morphemes:
      - { form: ойдо, meaning: 'давай', kind: word }
      - { form: тодматск, meaning: 'знакомиться', kind: root }
      - { form: ом, meaning: '(мы) — будущее время', kind: suffix }
    note: 'На «вы» или многим — Ойдолэ тодматском! Сравните: ми тодматским «мы познакомились».'
    status: sourced
    sources: [{ id: tatoeba, ref: '11685347' }, { id: tatoeba, ref: '11525035' }, { id: tatoeba, ref: '12278978' }, { id: alatyrev1983 }]

  # ── Кто я ────────────────────────────────────────────────
  - id: student
    udm: студент
    ru: студент
    ru_alt: [студентка]
    pos: существительное
    emoji: 🎓
    status: sourced
    sources: [{ id: uniparser }, { id: timerkhanova2012 }]
  - id: mon-student
    udm: Мон студент.
    ru: Я студент.
    ru_alt: [Я студентка.]
    kind: phrase
    emoji: 🎓
    note: Рода нет — одно слово и для студента, и для студентки.
    status: sourced
    sources: [{ id: timerkhanova2012 }, { id: samarova2011 }, { id: napolskikh }]
  - id: mon-no-student
    udm: Мон но студент.
    ru: Я тоже студент.
    ru_alt: [Я тоже студентка.]
    kind: phrase
    morphemes:
      - { form: мон, meaning: 'я', kind: word }
      - { form: но, meaning: 'тоже, и', kind: word }
      - { form: студент, meaning: 'студент', kind: word }
    note: 'Но — «тоже», ставится после слова: мон но «я тоже».'
    status: sourced
    sources: [{ id: timerkhanova2012 }, { id: tatoeba, ref: '12261336' }]
  - id: mon-dyshetis
    udm: Мон дышетӥсь.
    ru: Я преподаватель.
    ru_alt: [Я учитель., Я учительница., Я преподавательница.]
    kind: phrase
    emoji: 🧑‍🏫
    morphemes:
      - { form: мон, meaning: 'я', kind: word }
      - { form: дышет, meaning: 'учить (кого-то)', kind: root }
      - { form: ӥсь, meaning: 'тот, кто делает', kind: suffix }
    status: sourced
    sources: [{ id: kuara }, { id: tatoeba, ref: '11955871' }, { id: tatoeba, ref: '12156594' }]
  - id: mon-dyshetskis
    udm: Мон дышетскись.
    ru: Я учащийся.
    ru_alt: [Я ученик., Я ученица.]
    kind: phrase
    morphemes:
      - { form: мон, meaning: 'я', kind: word }
      - { form: дышетск, meaning: 'учиться', kind: root }
      - { form: ись, meaning: 'тот, кто делает', kind: suffix }
    note: 'Дышетскись — «тот, кто учится»; дышетӥсь — «тот, кто учит».'
    status: sourced
    sources: [{ id: tatoeba, ref: '12285180' }, { id: kyllyukam2012 }]
  - id: ton-student-a
    udm: Тон студент-а?
    ru: Ты студент?
    ru_alt: [Ты студентка?]
    kind: phrase
    morphemes:
      - { form: тон, meaning: 'ты', kind: word }
      - { form: студент, meaning: 'студент', kind: root }
      - { form: '-а', meaning: 'вопросительная частица', kind: particle }
    note: 'Вопрос без вопросительного слова — частица -а после того слова, о котором спрашивают: Тон студент-а?'
    status: sourced
    sources: [{ id: napolskikh }, { id: tatoeba, ref: '12341535' }]
  - id: ben-mon-student
    udm: Бен, мон студент.
    ru: Да, я студент.
    ru_alt: ['Да, я студентка.']
    kind: phrase
    status: sourced
    sources: [{ id: napolskikh }]
  - id: mon-student-ovol
    udm: Мон студент ӧвӧл.
    ru: Я не студент.
    ru_alt: [Я не студентка.]
    kind: phrase
    note: 'Ӧвӧл ставится в конце: «я студент не-есть».'
    status: sourced
    sources: [{ id: napolskikh }, { id: tatoeba, ref: '11672707' }]
  - id: mon-emchi-ovol
    udm: Мон эмчи ӧвӧл.
    ru: Я не врач.
    ru_alt: [Я не доктор.]
    kind: phrase
    status: sourced
    sources: [{ id: tatoeba, ref: '11672707' }]
  - id: nosh-ton
    udm: Нош тон?
    ru: А ты?
    kind: phrase
    status: sourced
    sources: [{ id: tatoeba, ref: '11726261' }, { id: tatoeba, ref: '12259123' }]

  # ── Откуда я ─────────────────────────────────────────────
  - id: ton-kytys-luiskod
    udm: Тон кытысь луиськод?
    ru: Ты откуда?
    udm_alt: ['Тон кытысь?']
    ru_alt: [Откуда ты?]
    kind: phrase
    morphemes:
      - { form: тон, meaning: 'ты', kind: word }
      - { form: кытысь, meaning: 'откуда', kind: word }
      - { form: луиськод, meaning: '(ты) бываешь, есть', kind: word }
    note: 'Вежливо — Тӥ кытысь луиськоды? «Вы откуда?»'
    status: sourced
    sources: [{ id: samarova2011 }, { id: alatyrev1983 }, { id: tatoeba, ref: '12273605' }]
  - id: glazkar
    udm: Глазкар
    ru: Глазов
    udm_alt: [Глаз]
    kind: word
    emoji: 🏙️
    morphemes:
      - { form: Глаз, meaning: 'Глазов', kind: root }
      - { form: кар, meaning: 'город', kind: root }
    note: 'Глазов по-удмуртски — Глаз или Глазкар (кар — «город»). Глазкар — скорее книжная форма; в разговоре говорят Глаз, «Глазов» с удмуртскими окончаниями или просто Кар — «город».'
    status: sourced
    sources: [{ id: timerkhanova2012 }, { id: udmwiki, ref: 'https://udm.wikipedia.org/wiki/Глаз' }, { id: uniparser }, { id: karakulova2001 }, { id: vakhrushev1983, ref: 'с. 554: Глазов — Глазов, Кар' }]
  - id: glazkarys
    udm: Глазкарысь
    ru: из Глазова
    udm_alt: [Глазысь, Глазовысь]
    kind: word
    morphemes:
      - { form: Глазкар, meaning: 'Глазов (Глаз + кар «город»)', kind: root }
      - { form: ысь, meaning: 'из (исходный падеж)', kind: suffix }
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: samarova2011 }, { id: tatoeba, ref: '12275677' }]
  - id: mon-glazkarys
    udm: Мон Глазкарысь.
    ru: Я из Глазова.
    udm_alt: [Мон Глазысь., Мон Глазовысь.]
    kind: phrase
    emoji: 🏙️
    note: 'Модель «Мон + место + -ысь», как в учебнике: Мон Вавожысь «я из Вавожа».'
    status: sourced
    sources: [{ id: samarova2011 }, { id: tatoeba, ref: '12275677' }, { id: timerkhanova2012 }]
  - id: izhkar
    udm: Ижкар
    ru: Ижевск
    kind: word
    emoji: 🏛️
    note: 'Ижкар — столица Удмуртии (шоркар).'
    status: sourced
    sources: [{ id: tatoeba, ref: '12275365' }, { id: udmwiki, ref: 'https://udm.wikipedia.org/wiki/Иж' }]
  - id: mon-izhkarys
    udm: Мон Ижкарысь.
    ru: Я из Ижевска.
    kind: phrase
    morphemes:
      - { form: мон, meaning: 'я', kind: word }
      - { form: Ижкар, meaning: 'Ижевск', kind: root }
      - { form: ысь, meaning: 'из', kind: suffix }
    status: sourced
    sources: [{ id: tatoeba, ref: '12275365' }, { id: samarova2011 }, { id: tatoeba, ref: '12275677' }]
  - id: mon-vengriys
    udm: Мон Венгриысь.
    ru: Я из Венгрии.
    kind: phrase
    emoji: 🇭🇺
    status: sourced
    sources: [{ id: tatoeba, ref: '12275677' }]
  - id: mon-udmurt
    udm: Мон удмурт.
    ru: Я удмурт.
    ru_alt: [Я удмуртка.]
    kind: phrase
    status: sourced
    sources: [{ id: samarova2011 }]
  - id: mon-dzuch
    udm: Мон ӟуч.
    ru: Я русский.
    ru_alt: [Я русская.]
    kind: phrase
    note: 'Ӟуч — «русский (человек)».'
    status: sourced
    sources: [{ id: samarova2011 }, { id: uniparser }]

