    ru_alt: [Мне 62 года.]
    kind: phrase
    status: sourced
    sources: [{ id: tatoeba, ref: '12154176' }]

  # ── Сколько? ─────────────────────────────────────────
  - id: koenya
    udm: кӧня
    ru: сколько
    pos: вопросительное слово
    emoji: ❓
    status: sourced
    sources: [{ id: uniparser }, { id: tatoeba, ref: '11522823' }]
  - id: mynam-kyk-korkae
    udm: Мынам кык коркае.
    ru: У меня два дома.
    kind: phrase
    emoji: 🏠
    morphemes:
      - { form: мынам, meaning: 'у меня', kind: word }
      - { form: кык, meaning: 'два', kind: word }
      - { form: корка, meaning: 'дом', kind: root }
      - { form: е, meaning: 'мой (после гласной)', kind: suffix }
    note: 'После гласной притяжательный суффикс «мой» — -е: корка → коркае.'
    status: sourced
    sources: [{ id: tatoeba, ref: '12189515' }, { id: alatyrev1983 }]
  - id: mon-nyl-kyl-todisko
    udm: Мон ньыль кыл тодӥсько.
    ru: Я знаю четыре языка.
    kind: phrase
    emoji: 🗣️
    morphemes:
      - { form: мон, meaning: 'я', kind: word }
      - { form: ньыль, meaning: 'четыре', kind: word }
      - { form: кыл, meaning: 'язык', kind: word }
      - { form: тод, meaning: 'знать', kind: root }
      - { form: ӥсько, meaning: '(я) — наст. время', kind: suffix }
    status: sourced
    sources: [{ id: tatoeba, ref: '12231901' }]
  - id: mon-kuin-gozhtet-gozhti
    udm: Мон куинь гожтэт гожтӥ.
    ru: Я написал три письма.
    ru_alt: [Я написала три письма.]
    kind: phrase
    emoji: ✉️
    note: 'Гожтӥ — прошедшее время («написал»): -ӥ вместо -ӥсько.'
