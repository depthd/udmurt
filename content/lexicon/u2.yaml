    sources: [{ id: tatoeba, ref: '12279022' }]
  - id: mynym-kyz-nyl-ares
    udm: Мыным кызь ньыль арес.
    ru: Мне двадцать четыре года.
    ru_alt: [Мне 24 года.]
    kind: phrase
    note: 'Двадцать четыре — кызь ньыль, просто подряд.'
