    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: sizym
    udm: сизьым
    ru: семь
    pos: числительное
    emoji: 7️⃣
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: odig-kyk-kuin
    udm: Одӥг, кык, куинь, старт!
    ru: Раз, два, три, старт!
    ru_alt: ['Один, два, три, старт!']
    kind: phrase
    emoji: 🏁
    status: sourced
    sources: [{ id: tatoeba, ref: '11933174' }]
  - id: arnyayn-sizym-nunal
    udm: Арняын сизьым нунал.
    ru: В неделе семь дней.
    kind: phrase
    emoji: 📅
    morphemes:
      - { form: арня, meaning: 'неделя', kind: root }
      - { form: ын, meaning: 'в (местный падеж)', kind: suffix }
      - { form: сизьым, meaning: 'семь', kind: word }
      - { form: нунал, meaning: 'день', kind: word }
    note: 'После числа существительное стоит в единственном числе: сизьым нунал — «семь день».'
    status: sourced
    sources: [{ id: tatoeba, ref: '11523479' }, { id: alatyrev1983 }]

  # ── 11–20 ────────────────────────────────────────────
  - id: das-odig
    udm: дас одӥг
    ru: одиннадцать
    kind: phrase
    morphemes:
      - { form: дас, meaning: 'десять', kind: word }
      - { form: одӥг, meaning: 'один', kind: word }
    note: '11–19 строятся просто: «десять» + число. Дас одӥг — «десять один».'
    status: sourced
    sources: [{ id: alatyrev1983 }]
  - id: das-kuin
    udm: дас куинь
    ru: тринадцать
    kind: phrase
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: tatoeba, ref: '12275749' }]
  - id: das-sizym
    udm: дас сизьым
    ru: семнадцать
    kind: phrase
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: tatoeba, ref: '12159452' }]
  - id: soly-das-sizym-ares
    udm: Солы дас сизьым арес.
    ru: Ей семнадцать лет.
    ru_alt: [Ему семнадцать лет., Ей 17 лет., Ему 17 лет.]
    kind: phrase
    morphemes:
      - { form: солы, meaning: 'ему, ей (форма от со)', kind: word }
      - { form: дас сизьым, meaning: 'семнадцать', kind: word }
      - { form: арес, meaning: 'лет', kind: word }
    note: 'Со — и «он», и «она»: рода нет.'
    status: sourced
    sources: [{ id: tatoeba, ref: '12159452' }]

  # ── Десятки ──────────────────────────────────────────
  - id: kuamyn
    udm: куамын
    ru: тридцать
    pos: числительное
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: nyldon
    udm: ньыльдон
    ru: сорок
    pos: числительное
    morphemes:
      - { form: ньыль, meaning: 'четыре', kind: root }
      - { form: дон, meaning: 'десять: -дон после звонкого, -тон после глухого (тон когда-то значило «10»)', kind: suffix }
    note: 'С 40 до 90 десятки — «число + тон/дон»: ньыльдон, витьтон, куатьтон…'
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: vitton
    udm: витьтон
    ru: пятьдесят
    pos: числительное
    morphemes:
      - { form: вить, meaning: 'пять', kind: root }
      - { form: тон, meaning: 'десяток', kind: suffix }
