    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: kuin
    udm: куинь
    ru: три
    pos: числительное
    emoji: 3️⃣
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: nyl
    udm: ньыль
    ru: четыре
    pos: числительное
    emoji: 4️⃣
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: vit
    udm: вить
    ru: пять
    pos: числительное
    emoji: 5️⃣
    note: 'Ср. финское viisi «пять».'
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: kuat
    udm: куать
    ru: шесть
    pos: числительное
    emoji: 6️⃣
