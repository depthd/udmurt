# Юнит 2 «Числа» — словник. Числительные — по таблице Алатырева (1983, § 37) и словарю uniparser;
# фразы — из Tatoeba (номер предложения в ref).
items:
  # ── 1–10 ─────────────────────────────────────────────
  - id: odig
    udm: одӥг
    ru: один
    pos: числительное
    emoji: 1️⃣
    status: sourced
    sources: [{ id: alatyrev1983 }, { id: uniparser }]
  - id: kyk
    udm: кык
    ru: два
    pos: числительное
    emoji: 2️⃣
