    sources: [{ id: uniparser }]
  - id: mon-anaime-yaratisko
    udm: Мон анайме яратӥсько.
    ru: Я люблю свою маму.
    ru_alt: [Я люблю маму., Я люблю свою мать.]
    kind: phrase
    emoji: ❤️
    morphemes:
      - { form: анай, meaning: 'мама', kind: root }
      - { form: ме, meaning: 'мою (кого? + «мой»)', kind: suffix }
