    ru: старший брат
    ru_alt: [брат, дядя]
    pos: существительное
    emoji: 🧑
    note: 'Агай — и «старший брат», и «дядя». Младший брат — вын.'
    status: sourced
    sources: [{ id: uniparser }]
  - id: apai
    udm: апай
    ru: старшая сестра
    ru_alt: [сестра, тётя]
