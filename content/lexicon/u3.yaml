    sources: [{ id: uniparser }, { id: tatoeba, ref: '12143763' }]
  - id: mynam-odig-agae
    udm: Мынам одӥг агае но кык сузэръёсы.
    ru: У меня один старший брат и две младшие сестры.
    kind: phrase
    morphemes:
      - { form: агай, meaning: 'старший брат', kind: root }
      - { form: е, meaning: 'мой', kind: suffix }
      - { form: но, meaning: 'и', kind: particle }
      - { form: сузэр, meaning: 'младшая сестра', kind: root }
      - { form: ъёс, meaning: 'множественное число', kind: suffix }
      - { form: ы, meaning: 'мои', kind: suffix }
    note: 'Обычно после числа — единственное число, но иногда, как здесь, и множественное (Алатырев, § 37).'
    status: sourced
    sources: [{ id: tatoeba, ref: '12174399' }, { id: alatyrev1983 }]
  - id: tom-tynad-vynyd
    udm: Том тынад выныд.
    ru: Том твой брат.
    ru_alt: [Том — твой брат., Том твой младший брат.]
    kind: phrase
    morphemes:
      - { form: тынад, meaning: 'твой', kind: word }
      - { form: вын, meaning: 'младший брат', kind: root }
      - { form: ыд, meaning: 'твой', kind: suffix }
    note: '«Твой» говорится дважды: тынад … вын-ыд — как «у тебя брат-твой».'
    status: sourced
    sources: [{ id: tatoeba, ref: '12189568' }]
  - id: soos-suzeryos
