    udm: анай
    ru: мама
    ru_alt: [мать]
    pos: существительное
    emoji: 👩
    status: sourced
    sources: [{ id: uniparser }, { id: tatoeba, ref: '11685314' }]
  - id: atai
    udm: атай
    ru: папа
    ru_alt: [отец]
    pos: существительное
    emoji: 👨
