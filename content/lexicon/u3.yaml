    sources: [{ id: uniparser }, { id: tatoeba, ref: '12175744' }]
  - id: anai-atai
    udm: анай-атай
    ru: родители
    pos: существительное
    emoji: 👨‍👩‍👧
    morphemes:
      - { form: анай, meaning: 'мама', kind: word }
      - { form: атай, meaning: 'папа', kind: word }
    note: 'Парное слово: «мама-папа» = родители. В удмуртском таких пар много.'
    status: sourced
    sources: [{ id: tatoeba, ref: '11704978' }, { id: tatoeba, ref: '11955864' }]
  - id: pesyanai
